<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rolex Key AdBlocker</title><link rel="stylesheet" href="popup.css"></head>
<body><main class="app">
<header><div class="logo">RK</div><div><h1>Rolex Key</h1><p>AD BLOCKER</p></div><span class="shield">◆</span></header>
<section class="hero"><div class="statusline"><span id="dot" class="dot"></span><span id="status">Protection enabled</span></div><button id="toggle" class="power" aria-label="Toggle protection">⏻</button><p class="muted">Ad & tracker protection</p></section>
<section class="stats"><div class="stat"><span class="staticon">◈</span><strong id="blocked">—</strong><small>Blocked requests*</small></div><div class="stat"><span class="staticon">◎</span><strong id="siteState">Active</strong><small>This website</small></div></section>
<section class="site"><div><small>Current website</small><strong id="hostname">Open a website</strong></div><button id="allow" class="secondary">Allow site</button></section>
<p class="note">*The count is a local estimate where Chrome exposes matching events; it may not include every blocked request.</p><footer><a href="options.html" target="_blank">Settings & allowlist ↗</a><span>v1.0.0</span></footer>
</main><script src="popup.js"></script></body></html>
