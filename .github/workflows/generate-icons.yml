name: Generate extension icons
on:
  push:
    branches: [main]
    paths:
      - "icons/rolex-key-adblocker.svg"
      - "scripts/generate_icons.py"
      - ".github/workflows/generate-icons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Generate PNG sizes
        run: python scripts/generate_icons.py
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png
          if git diff --cached --quiet; then
            echo "Generated icons are already current."
          else
            git commit -m "Generate custom extension icon sizes"
            git push
          fi
