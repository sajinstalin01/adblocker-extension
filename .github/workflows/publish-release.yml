name: Publish extension release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (for example v3.9.0)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate tag and manifest version
        id: release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; fi
          VERSION="${TAG#v}"
          node -e 'const m=require("./manifest.json");if(m.version!==process.argv[1]){console.error("Tag version "+process.argv[1]+" does not match manifest version "+m.version);process.exit(1)}' "$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate extension files
        run: node scripts/validate.mjs
      - name: Build source archive from tagged commit
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=rolex-key-adblocker/ "HEAD" -o "dist/rolex-key-adblocker-${{ steps.release.outputs.version }}.zip"
      - name: Commit refreshed feed to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git pull --ff-only origin main
          node scripts/update-release-feed.mjs
          if git diff --quiet -- update-feed.json; then
            echo "Release feed already matches this release."
          else
            git add update-feed.json
            git commit -m "Update release feed for v$RELEASE_VERSION"
            git push origin main
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/rolex-key-adblocker-$VERSION.zip" --clobber
          else
            gh release create "$TAG" "dist/rolex-key-adblocker-$VERSION.zip" --title "Rolex Key AdBlocker $TAG" --notes-file <(node scripts/release-notes.mjs "$VERSION")
          fi
