<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome · Rolex Key</title><link rel="stylesheet" href="options.css"></head><body><main><header><div class="logo">RK</div><div><h1>Welcome to Rolex Key AdBlocker <span>3.5.0</span></h1><p data-i18n="welcomeSubtitle">Quick setup before browsing.</p></div></header><section class="panel"><h2 data-i18n="chooseProfile">Choose your protection</h2><p class="help" data-i18n="welcomeHelp">You can change settings any time.</p><label class="fieldrow"><span><strong>Protection profile</strong></span><select id="profile"><option value="balanced">Balanced</option><option value="strict">Strict</option><option value="minimal">Minimal</option></select></label><label class="fieldrow"><span><strong>Language / ഭാഷ</strong></span><select id="locale"><option value="en">English</option><option value="ml">മലയാളം</option></select></label><label class="switchrow"><span><strong>Reading mode</strong></span><input id="reading" type="checkbox"></label><label class="switchrow"><span><strong>Anti-adblock detection</strong></span><input id="anti" type="checkbox"></label><p class="help" data-i18n="permissionExplain">Settings stay local.</p><div class="actions"><button id="finish" data-i18n="finishSetup">Finish setup</button><button id="skip" class="secondary" data-i18n="skipSetup">Skip for now</button></div><p id="status" role="status"></p></section><section class="panel"><h2 data-i18n="gettingStarted">Getting started</h2><p class="help" data-i18n="gettingHelp">Use the popup to pause protection or allow the current site.</p></section></main><script src="i18n.js"></script><script src="welcome.js"></script></body></html>
